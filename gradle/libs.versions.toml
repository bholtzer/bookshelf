[versions]
agp                     = "8.5.2"
kotlin                  = "2.0.0"
ksp                     = "2.0.0-1.0.22"
hilt                    = "2.51.1"
compose-bom             = "2024.09.00"
activity-compose        = "1.9.2"
navigation-compose      = "2.8.2"
hilt-navigation-compose = "1.2.0"
room                    = "2.6.1"
firebase-bom            = "33.4.0"
google-id               = "1.1.1"
credentials             = "1.3.0"
coil                    = "2.7.0"
work                    = "2.9.1"
hilt-work               = "1.2.0"
coroutines              = "1.8.1"
datastore               = "1.1.1"

[libraries]
# Compose
compose-bom                  = { group = "androidx.compose",    name = "compose-bom",                version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling           = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation           = { group = "androidx.compose.foundation", name = "foundation" }
activity-compose             = { group = "androidx.activity",   name = "activity-compose",           version.ref = "activity-compose" }

# Navigation
navigation-compose           = { group = "androidx.navigation", name = "navigation-compose",          version.ref = "navigation-compose" }
hilt-navigation-compose      = { group = "androidx.hilt",       name = "hilt-navigation-compose",     version.ref = "hilt-navigation-compose" }

# Hilt
hilt-android                 = { group = "com.google.dagger",   name = "hilt-android",                version.ref = "hilt" }
hilt-compiler                = { group = "com.google.dagger",   name = "hilt-android-compiler",       version.ref = "hilt" }
hilt-work                    = { group = "androidx.hilt",       name = "hilt-work",                   version.ref = "hilt-work" }
hilt-work-compiler           = { group = "androidx.hilt",       name = "hilt-compiler",               version.ref = "hilt-work" }

# Room
room-runtime                 = { group = "androidx.room",       name = "room-runtime",                version.ref = "room" }
room-ktx                     = { group = "androidx.room",       name = "room-ktx",                    version.ref = "room" }
room-compiler                = { group = "androidx.room",       name = "room-compiler",               version.ref = "room" }

# Firebase
firebase-bom                 = { group = "com.google.firebase", name = "firebase-bom",                version.ref = "firebase-bom" }
firebase-auth-ktx            = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore-ktx       = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-storage-ktx         = { group = "com.google.firebase", name = "firebase-storage-ktx" }

# Auth
google-id                    = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "google-id" }
credentials                  = { group = "androidx.credentials", name = "credentials",                version.ref = "credentials" }
credentials-play-services    = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }

# Coil
coil-compose                 = { group = "io.coil-kt",          name = "coil-compose",                version.ref = "coil" }
coil-pdf                     = { group = "io.coil-kt",          name = "coil-svg",                    version.ref = "coil" }

# WorkManager
work-runtime-ktx             = { group = "androidx.work",       name = "work-runtime-ktx",            version.ref = "work" }

# Coroutines
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# DataStore
datastore-preferences        = { group = "androidx.datastore", name = "datastore-preferences",        version.ref = "datastore" }

[plugins]
android-application = { id = "com.android.application",          version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",   version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",          version.ref = "ksp" }
google-services     = { id = "com.google.gms.google-services",  version = "4.4.2" }
