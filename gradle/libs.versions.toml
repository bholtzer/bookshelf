[versions]
agp                     = "8.3.2"
kotlin                  = "1.9.23"
ksp                     = "1.9.23-1.0.20"
hilt                    = "2.51.1"
compose-bom             = "2024.06.00"
activity-compose        = "1.9.0"
navigation-compose      = "2.7.7"
hilt-navigation-compose = "1.2.0"
lifecycle-runtime-compose = "2.8.2"
room                    = "2.6.1"
firebase-bom            = "33.1.0"
google-id               = "1.1.1"
credentials             = "1.2.2"
coil                    = "2.6.0"
work                    = "2.9.0"
hilt-work               = "1.2.0"
coroutines              = "1.8.0"
datastore               = "1.1.1"
install-referrer        = "2.2"
billing                 = "9.1.0"

[libraries]
compose-bom                      = { group = "androidx.compose",    name = "compose-bom",                       version.ref = "compose-bom" }
compose-ui                       = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics              = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview       = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling               = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3                = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended  = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation               = { group = "androidx.compose.foundation", name = "foundation" }
activity-compose                 = { group = "androidx.activity",   name = "activity-compose",                  version.ref = "activity-compose" }
navigation-compose               = { group = "androidx.navigation", name = "navigation-compose",                version.ref = "navigation-compose" }
hilt-navigation-compose          = { group = "androidx.hilt",       name = "hilt-navigation-compose",           version.ref = "hilt-navigation-compose" }
lifecycle-runtime-compose        = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose",         version.ref = "lifecycle-runtime-compose" }
hilt-android                     = { group = "com.google.dagger",   name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                    = { group = "com.google.dagger",   name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-work                        = { group = "androidx.hilt",       name = "hilt-work",                         version.ref = "hilt-work" }
hilt-work-compiler               = { group = "androidx.hilt",       name = "hilt-compiler",                     version.ref = "hilt-work" }
room-runtime                     = { group = "androidx.room",       name = "room-runtime",                      version.ref = "room" }
room-ktx                         = { group = "androidx.room",       name = "room-ktx",                          version.ref = "room" }
room-compiler                    = { group = "androidx.room",       name = "room-compiler",                     version.ref = "room" }
firebase-bom                     = { group = "com.google.firebase", name = "firebase-bom",                      version.ref = "firebase-bom" }
firebase-auth-ktx                = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-analytics               = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-firestore-ktx           = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-storage-ktx             = { group = "com.google.firebase", name = "firebase-storage-ktx" }
firebase-appcheck-debug          = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
firebase-appcheck-playintegrity  = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
google-id                        = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "google-id" }
credentials                      = { group = "androidx.credentials", name = "credentials",                      version.ref = "credentials" }
credentials-play-services        = { group = "androidx.credentials", name = "credentials-play-services-auth",   version.ref = "credentials" }
coil-compose                     = { group = "io.coil-kt",          name = "coil-compose",                      version.ref = "coil" }
work-runtime-ktx                 = { group = "androidx.work",       name = "work-runtime-ktx",                  version.ref = "work" }
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",      version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
datastore-preferences            = { group = "androidx.datastore", name = "datastore-preferences",              version.ref = "datastore" }
install-referrer                 = { group = "com.android.installreferrer", name = "installreferrer",            version.ref = "install-referrer" }
billing-client                   = { group = "com.android.billingclient", name = "billing",                      version.ref = "billing" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
google-services     = { id = "com.google.gms.google-services",      version = "4.4.2" }
