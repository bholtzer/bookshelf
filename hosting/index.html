<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6750A4">
  <title>Open shared MaDaFim book</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f2fa;
      color: #1d1b20;
    }
    main {
      width: min(560px, calc(100% - 48px));
      padding: 32px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .12);
      text-align: center;
    }
    h1 { margin-top: 0; }
    .code {
      margin: 24px 0;
      padding: 14px;
      border-radius: 12px;
      background: #eaddff;
      color: #21005d;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    a.button {
      display: block;
      padding: 14px 20px;
      border-radius: 999px;
      background: #6750a4;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
    p { line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <h1>A MaDaFim book was shared with you</h1>
    <p>Tap below to open the invitation in the MaDaFim Android app.</p>
    <div class="code" id="code">Book invite</div>
    <a class="button" id="open-app" href="#">Open in MaDaFim</a>
    <p>If the app does not open, launch MaDaFim, choose <strong>Join shared book</strong>, and enter the code above.</p>
    <p><a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms</a> · <a href="/delete-account.html">Delete account</a></p>
  </main>
  <script>
    const match = location.pathname.match(/\/book-invite\/(BK-[A-Z0-9]{12})/i);
    const code = match ? match[1].toUpperCase() : "";
    const target = `madafim://book-invite/${encodeURIComponent(code)}${location.search}`;
    document.getElementById("code").textContent = code || "Invalid invite link";
    const button = document.getElementById("open-app");
    if (code) {
      button.href = target;
    } else {
      button.removeAttribute("href");
      button.textContent = "Invalid invite link";
    }
  </script>
</body>
</html>
